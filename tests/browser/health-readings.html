<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Health record synchronization checks</title>
<pre id="results">RUNNING</pre>
<script>
"use strict";
(async () => {
    const fixtures = await fetch("/fixtures.json").then(response => response.json());
    const results = [];
    const runtimeErrors = [];
    const pause = (ms = 20) => new Promise(resolve => setTimeout(resolve, ms));
    function assert(condition, message) { if (!condition) throw new Error(message); }
    async function waitFor(condition) {
        for (let attempt = 0; attempt < 200; attempt++) {
            if (condition()) return;
            await pause();
        }
        throw new Error("Timed out waiting for updated health records");
    }
    const row = (changes = {}) => ({ id: 1, heart_rate: 72, spo2: 98, systolic: 120, diastolic: 80, temperature: 36.5, measured_at: "2020-01-02T10:30", ...changes });
    function database(rows = []) {
        const state = { rows, calls: [], fail: false, failSave: false, failDelete: false, failUpdate: false };
        state.fetch = async (url, options = {}) => {
            assert(url === "/api/readings" || /^\/api\/readings\/\d+$/.test(url), "Unexpected endpoint: " + url);
            state.calls.push({ url, ...options });
            if (options.method === "PUT") {
                assert(options.headers["X-SmartHealth-Action"] === "edit-reading", "PUT request protection missing");
                if (state.failUpdate) {
                    return { ok: false, status: 500, json: async () => ({ status: "error", message: "Unable to update health reading. Please try again." }) };
                }
                const id = Number(url.split("/").at(-1));
                const index = state.rows.findIndex(item => item.id === id);
                if (index === -1) {
                    return { ok: false, status: 404, json: async () => ({ status: "error", message: "Health reading not found." }) };
                }
                state.rows[index] = { ...state.rows[index], ...JSON.parse(options.body), id };
                return { ok: true, status: 200, json: async () => ({ status: "success", reading_id: id }) };
            }
            if (options.method === "DELETE") {
                assert(JSON.parse(options.body).confirmed === true, "DELETE requires explicit confirmation");
                assert(options.headers["X-SmartHealth-Action"] === "delete-reading", "DELETE request protection missing");
                if (state.failDelete) {
                    return { ok: false, status: 500, json: async () => ({ status: "error", message: "Unable to delete health reading. Please try again." }) };
                }
                const id = Number(url.split("/").at(-1));
                const index = state.rows.findIndex(item => item.id === id);
                if (index === -1) {
                    return { ok: false, status: 404, json: async () => ({ status: "error", message: "Health reading not found." }) };
                }
                state.rows.splice(index, 1);
                return { ok: true, status: 200, json: async () => ({ status: "success", reading_id: id }) };
            }
            if (state.fail || (options.method === "POST" && state.failSave)) {
                return { ok: false, status: 503, json: async () => ({ status: "error", message: "Unable to load health records. Please try again." }) };
            }
            if (options.method === "POST") {
                const id = Math.max(0, ...state.rows.map(item => item.id)) + 1;
                state.rows.push(row({ ...JSON.parse(options.body), id }));
                return { ok: true, status: 201, json: async () => ({ status: "success", reading_id: id }) };
            }
            const snapshot = state.rows.map(item => ({ ...item }));
            return { ok: true, status: 200, json: async () => ({ status: "success", readings: snapshot }) };
        };
        return state;
    }
    async function setup(page, state, options = {}) {
        const frame = document.createElement("iframe");
        frame.style.cssText = "width:1100px;height:850px;border:0;display:block";
        const loaded = new Promise(resolve => { frame.onload = resolve; });
        frame.srcdoc = fixtures.pages[page].replace(/<script\b[^>]*>[\s\S]*?<\/script>/g, "");
        document.body.appendChild(frame);
        await loaded;
        // Native dialog close/focus events need a rendered iframe in Chrome.
        frame.scrollIntoView({ behavior: "instant", block: "start" });
        const win = frame.contentWindow;
        win.sessionStorage.clear();
        win.localStorage.clear();
        // A stale browser dataset must never become the source for patient records.
        win.localStorage.setItem("smarthealth_demo_readings", JSON.stringify([{ date: "2025-01-01T10:00", heartRate: 999, spo2: 1, systolic: 999, diastolic: 999, temperature: 99 }]));
        win.addEventListener("error", event => runtimeErrors.push(event.message));
        win.addEventListener("unhandledrejection", event => runtimeErrors.push(String(event.reason)));
        win.fetch = options.fetch || state.fetch;
        const confirmations = [];
        win.confirm = message => { confirmations.push(message); return options.confirm === true; };
        if (options.noChannel) win.BroadcastChannel = undefined;
        const charts = [];
        if (options.realPlotly) {
            win.eval(fixtures.scripts.plotly);
        } else if (!options.noPlotly) {
            win.Plotly = {
                purge(element) { element.replaceChildren(); },
                react(element, data) { charts.push(data); }
            };
        }
        for (const script of ["notifications.js", "health-readings.js", ...(page === "add-reading" ? ["add-reading.js"] : [...(page === "health-alerts" ? ["alerts.js"] : []), "dashboard.js"]), ...(page === "health-alerts" ? ["sidebar.js"] : [])]) {
            win.eval(fixtures.scripts[script]);
        }
        return { frame, win, charts, confirmations, query: selector => frame.contentDocument.querySelector(selector) };
    }
    function submitReading(context, values = {}) {
        const fields = { heartRate: "85", spo2: "97", systolic: "125", diastolic: "82", temperature: "36.7", readingDate: "2020-01-03T11:00", ...values };
        for (const [id, value] of Object.entries(fields)) context.query("#" + id).value = value;
        context.query("#healthReadingForm").requestSubmit();
    }
    async function check(label, test) {
        try { await test(); results.push("PASS " + label); }
        catch (error) { results.push("FAIL " + label + ": " + error.message); }
        document.querySelectorAll("iframe").forEach(frame => frame.remove());
    }

    await check("Dashboard loads saved API records instead of old browser data", async () => {
        const state = database([row()]);
        const context = await setup("dashboard", state);
        await waitFor(() => context.query("#latestHeartRate").textContent === "72");
        assert(context.query("#latestSpo2").textContent === "98", "Oxygen card incorrect");
        assert(context.query("#latestBloodPressure").textContent === "120/80", "Blood pressure card incorrect");
        assert(context.query("#latestTemperature").textContent === "36.5", "Temperature card incorrect");
        assert(context.query("#readingsTableBody tr").textContent.includes("72 BPM"), "History missing API record");
        assert(state.calls[0].cache === "no-store" && state.calls[0].credentials === "same-origin", "Request must fetch uncached signed-in data");
    });
    await check("Saving a record refreshes the reading list and an open dashboard", async () => {
        const state = database([row()]);
        const dashboard = await setup("dashboard", state);
        await waitFor(() => dashboard.query("#latestHeartRate").textContent === "72");
        const form = await setup("add-reading", state);
        await waitFor(() => form.query("#savedReadingsBody tr"));
        submitReading(form);
        await waitFor(() => form.query("#savedReadingsBody tr").textContent.includes("85 BPM"));
        await waitFor(() => dashboard.query("#latestHeartRate").textContent === "85");
        assert(dashboard.query("#readingsTableBody tr").textContent.includes("85 BPM"), "Dashboard table did not refresh");
        assert(dashboard.charts.at(-1)[0].y.at(-1) === 85, "Chart did not refresh");
    });
    await check("Opening the dashboard after a save loads the new record", async () => {
        const state = database();
        const form = await setup("add-reading", state);
        submitReading(form);
        await waitFor(() => form.query(".notification-success"));
        const dashboard = await setup("dashboard", state);
        await waitFor(() => dashboard.query("#latestHeartRate").textContent === "85");
        assert(dashboard.query("#readingsTableBody tr").textContent.includes("2020-01-03 11:00"), "Saved date missing");
    });
    await check("Returning with browser Back reloads both reading pages", async () => {
        const state = database([row()]);
        const dashboard = await setup("dashboard", state);
        const form = await setup("add-reading", state);
        await waitFor(() => dashboard.query("#latestHeartRate").textContent === "72" && form.query("#savedReadingsBody tr"));
        state.rows.push(row({ id: 2, heart_rate: 90, measured_at: "2020-01-03T11:00" }));
        for (const context of [dashboard, form]) {
            context.win.dispatchEvent(new context.win.PageTransitionEvent("pageshow", { persisted: true }));
        }
        await waitFor(() => dashboard.query("#latestHeartRate").textContent === "90" && form.query("#savedReadingsBody tr").textContent.includes("90 BPM"));
    });
    await check("Refocusing a page refreshes records changed elsewhere", async () => {
        const state = database([row()]);
        const context = await setup("dashboard", state);
        await waitFor(() => context.query("#latestHeartRate").textContent === "72");
        state.rows = [row({ heart_rate: 88 })];
        context.win.dispatchEvent(new context.win.Event("focus"));
        await waitFor(() => context.query("#latestHeartRate").textContent === "88");
    });
    await check("Latest cards and histories use measurement time and ID consistently", async () => {
        const state = database([
            row({ id: 9, heart_rate: 99, measured_at: "2020-01-01T10:00" }),
            row({ id: 2, heart_rate: 82 }), row({ id: 3, heart_rate: 83 })
        ]);
        const dashboard = await setup("dashboard", state);
        const form = await setup("add-reading", state);
        await waitFor(() => dashboard.query("#latestHeartRate").textContent === "83" && form.query("#savedReadingsBody tr"));
        assert(dashboard.query("#readingsTableBody tr").textContent.includes("83 BPM"), "Dashboard order incorrect");
        assert(form.query("#savedReadingsBody tr").textContent.includes("83 BPM"), "Reading list order differs");
    });
    await check("Trends use chronological API data and update for the selected metric", async () => {
        const state = database([
            row({ id: 1, measured_at: "2020-01-01T10:30" }),
            row({ id: 2, heart_rate: 80, spo2: 97, measured_at: "2020-01-09T10:30" }),
            row({ id: 3, heart_rate: 90, spo2: 96, measured_at: "2020-01-10T10:30" })
        ]);
        const context = await setup("dashboard", state);
        await waitFor(() => context.charts.length > 0);
        assert(JSON.stringify(context.charts.at(-1)[0].y) === "[80,90]", "Heart rate trend order or date window incorrect");
        const metric = context.query("#healthMetric");
        metric.value = "spo2";
        metric.dispatchEvent(new context.win.Event("change"));
        assert(JSON.stringify(context.charts.at(-1)[0].y) === "[97,96]", "Selected trend uses stale data");
    });
    await check("Alerts use the newest saved API record including heart rate", async () => {
        const state = database([row(), row({ id: 2, heart_rate: 115, spo2: 94, measured_at: "2020-01-03T10:30" })]);
        const context = await setup("health-alerts", state);
        await waitFor(() => context.query(".health-alert-card"));
        assert(context.frame.contentDocument.querySelectorAll(".health-alert-card").length === 2, "Alerts did not use saved values");
        assert(context.query("#alertsContainer").textContent.includes("115 BPM"), "Heart rate API field not analyzed");
    });
    await check("Alerts use the latest save even when its measurement is backdated", async () => {
        const state = database([row({ id: 2, measured_at: "2020-01-03T10:30" })]);
        const dashboard = await setup("dashboard", state);
        const alerts = await setup("health-alerts", state);
        await waitFor(() => alerts.query(".no-alert-message"));
        const form = await setup("add-reading", state);
        submitReading(form, { heartRate: "120", spo2: "94", temperature: "39", readingDate: "2020-01-01T10:00" });
        await waitFor(() => form.query(".notification-success"));
        await waitFor(() => alerts.frame.contentDocument.querySelectorAll(".health-alert-card").length === 3);
        assert(alerts.query("#alertsContainer").textContent.includes("120 BPM"), "Backdated save was ignored by alerts");
        assert(dashboard.query("#latestHeartRate").textContent === "72", "Existing measurement-based overview changed");
        assert(dashboard.query("#readingsTableBody tr").textContent.includes("2020-01-03"), "Existing history ordering changed");
    });
    await check("All five demonstration thresholds match independently and exclude equality", async () => {
        const context = await setup("health-alerts", database([row()]));
        await waitFor(() => context.query(".no-alert-message"));
        const boundaries = row({ heart_rate: 100, spo2: 95, systolic: 140, diastolic: 90, temperature: 38 });
        context.win.displayHealthAlerts(boundaries);
        assert(context.query("#alertSummary").textContent === "No demo rules matched.", "Equality must not trigger alerts");
        const matches = { heart_rate: 101, spo2: 94.99, systolic: 141, diastolic: 91, temperature: 38.01 };
        for (const [field, value] of Object.entries(matches)) {
            context.win.displayHealthAlerts({ ...boundaries, [field]: value });
            assert(context.frame.contentDocument.querySelectorAll(".health-alert-card").length === 1, field + " threshold failed");
        }
        context.win.displayHealthAlerts({ ...boundaries, ...matches });
        assert(context.frame.contentDocument.querySelectorAll(".health-alert-card").length === 5, "All matching rules should display");
        context.win.displayHealthAlerts(row());
        assert(!context.query(".health-alert-card") && context.query(".no-alert-message"), "Normal reading did not clear alerts and show information");
        assert(context.query(".alert-disclaimer").textContent.includes("predefined academic demonstration thresholds"), "Academic disclaimer missing");
    });
    await check("Numeric strings are evaluated while missing and invalid values stay unavailable", async () => {
        const state = database([row({ heart_rate: "120", spo2: "94", systolic: "150", diastolic: "95", temperature: "39" })]);
        const context = await setup("health-alerts", state);
        await waitFor(() => context.frame.contentDocument.querySelectorAll(".health-alert-card").length === 5);
        for (const value of [null, undefined, "", " ", "invalid", "NaN", "Infinity", false, [], {}]) {
            context.win.displayHealthAlerts(row({ heart_rate: value, spo2: value, systolic: value, diastolic: value, temperature: value }));
            assert(context.query("#alertSummary").textContent.includes("incomplete"), "Unavailable value was treated as normal: " + String(value));
            assert(!context.query(".health-alert-card"), "Unavailable value caused a false alert");
        }
        context.win.displayHealthAlerts(row({ heart_rate: 120, spo2: null }));
        assert(context.query(".health-alert-card") && context.query("#alertsContainer").textContent.includes("Missing or invalid"), "Available alerts or missing-data information lost");
    });
    await check("A partial latest save does not fall back to old measurements", async () => {
        const context = await setup("health-alerts", database([
            row({ id: 1, heart_rate: 120 }),
            row({ id: 2, heart_rate: null, spo2: null, temperature: null, measured_at: null })
        ]));
        await waitFor(() => context.query("#alertSummary").textContent.includes("incomplete"));
        assert(!context.query(".health-alert-card"), "An older reading was analyzed instead of the incomplete latest save");
        assert(context.query("#alertsContainer").textContent.includes("Heart Rate"), "Missing measurement not identified");
    });
    await check("API failure clears stale alerts and never shows add-reading or no-match information", async () => {
        const state = database([row({ heart_rate: 120 })]);
        const context = await setup("health-alerts", state);
        await waitFor(() => context.query(".health-alert-card"));
        state.fail = true;
        context.win.dispatchEvent(new context.win.Event("focus"));
        await waitFor(() => context.query("#alertSummary").textContent.includes("could not be loaded"));
        assert(!context.query(".health-alert-card"), "Stale alert survived an API failure");
        assert(!context.query("#alertsContainer").textContent.includes("Add a demo reading"), "API failure was presented as empty data");
        state.fail = false;
        state.rows = [row({ id: 2 })];
        context.win.dispatchEvent(new context.win.Event("focus"));
        await waitFor(() => context.query("#alertSummary").textContent === "No demo rules matched.");
    });
    await check("Network failures and malformed API responses show alert errors", async () => {
        const failures = [
            async () => { throw new Error("Network unavailable"); },
            async () => ({ ok: true, status: 200, json: async () => { throw new SyntaxError("Invalid JSON"); } }),
            async () => ({ ok: true, status: 200, json: async () => ({ status: "success" }) })
        ];
        for (const fetch of failures) {
            const context = await setup("health-alerts", database(), { fetch });
            await waitFor(() => context.query("#alertSummary").textContent.includes("could not be loaded"));
            assert(!context.query(".health-alert-card"), "Invalid response displayed an alert");
            assert(context.query("#alertsContainer").textContent.trim(), "Error explanation missing");
            context.frame.remove();
        }
    });
    await check("An empty current account clears old values and browser demo records", async () => {
        const state = database([row()]);
        const context = await setup("dashboard", state);
        const alerts = await setup("health-alerts", state);
        await waitFor(() => context.query("#latestHeartRate").textContent === "72");
        state.rows = [];
        context.win.dispatchEvent(new context.win.Event("focus"));
        alerts.win.dispatchEvent(new alerts.win.Event("focus"));
        await waitFor(() => context.query("#latestHeartRate").textContent === "--");
        assert(!context.query("#readingsTableBody tr"), "Old patient rows remain visible");
        assert(!context.query("#dashboardEmptyMessage").hidden, "Empty state hidden");
        await waitFor(() => alerts.query("#alertSummary").textContent === "No health readings available.");
        assert(!alerts.query(".health-alert-card"), "Old patient alerts remain visible");
        assert(alerts.query("#alertSummary").textContent === "No health readings available.", "Empty state not distinguished from no matches");
    });
    await check("Account changes display only the current API patient's data", async () => {
        const state = database([row({ heart_rate: 75 })]);
        const context = await setup("dashboard", state);
        await waitFor(() => context.query("#latestHeartRate").textContent === "75");
        state.rows = [row({ id: 20, heart_rate: 64 })];
        context.win.dispatchEvent(new context.win.Event("focus"));
        await waitFor(() => context.query("#latestHeartRate").textContent === "64");
        assert(!context.query("#readingsTableBody").textContent.includes("75 BPM"), "Another account's readings remain visible");
    });
    await check("Failed fetches show an error and recover on refresh", async () => {
        const state = database([row()]);
        state.fail = true;
        const context = await setup("dashboard", state);
        await waitFor(() => context.query(".notification-error"));
        assert(context.query("#latestHeartRate").textContent === "--", "Failed fetch displayed readings");
        assert(context.query("#dashboardEmptyMessage").textContent.includes("could not be loaded"), "Failed fetch shown as empty history");
        state.fail = false;
        context.win.dispatchEvent(new context.win.Event("focus"));
        await waitFor(() => context.query("#latestHeartRate").textContent === "72");
        assert(context.query("#dashboardReadingsStatus").textContent === "", "Load error did not clear");
    });
    await check("A slow old fetch cannot replace newer dashboard data", async () => {
        const state = database();
        const requests = [];
        const context = await setup("dashboard", state, { fetch: () => new Promise(resolve => requests.push(resolve)) });
        await waitFor(() => requests.length === 1);
        context.win.dispatchEvent(new context.win.Event("focus"));
        await waitFor(() => requests.length === 2);
        const response = rows => ({ ok: true, status: 200, json: async () => ({ status: "success", readings: rows }) });
        requests[1](response([row({ heart_rate: 92 })]));
        await waitFor(() => context.query("#latestHeartRate").textContent === "92");
        requests[0](response([row({ heart_rate: 61 })]));
        await pause(100);
        assert(context.query("#latestHeartRate").textContent === "92", "Stale response overwrote the latest fetch");
    });
    await check("Cards and history still update if the external chart library is unavailable", async () => {
        const context = await setup("dashboard", database([row()]), { noPlotly: true });
        await waitFor(() => context.query("#latestHeartRate").textContent === "72");
        assert(context.query("#readingsTableBody tr"), "Chart failure stopped history rendering");
        assert(context.query("#chartNote").textContent.includes("could not load"), "Chart unavailable message missing");
    });
    await check("A failed save preserves the form and does not change dashboard readings", async () => {
        const state = database([row()]);
        state.failSave = true;
        const dashboard = await setup("dashboard", state);
        const form = await setup("add-reading", state);
        await waitFor(() => dashboard.query("#latestHeartRate").textContent === "72");
        submitReading(form);
        await waitFor(() => form.query(".notification-error"));
        assert(form.query("#heartRate").value === "85", "Failed save erased entered data");
        assert(dashboard.query("#latestHeartRate").textContent === "72" && state.rows.length === 1, "Failed save changed recorded data");
    });
    await check("Both record tables show Actions and one Delete button per saved row", async () => {
        for (const page of ["dashboard", "health-records", "add-reading"]) {
            const context = await setup(page, database([row(), row({ id: 2 })]));
            await waitFor(() => context.frame.contentDocument.querySelectorAll("[data-delete-reading]").length === 2);
            assert(context.query(".health-table th:last-child").textContent === "Actions", "Actions heading missing");
            assert(context.query("[data-delete-reading]").type === "button", "Delete button could submit the form");
        }
    });
    await check("Cancelling confirmation sends no DELETE and leaves every reading intact", async () => {
        for (const page of ["dashboard", "health-records", "add-reading"]) {
            const state = database([row()]);
            const context = await setup(page, state);
            await waitFor(() => context.query("[data-delete-reading]"));
            context.query("[data-delete-reading]").click();
            await pause();
            assert(context.confirmations.length === 1 && context.confirmations[0].includes("#1"), "Record confirmation missing");
            assert(!state.calls.some(call => call.method === "DELETE"), "Cancelled reading was deleted");
            assert(state.rows.length === 1 && context.query(".health-table tbody tr"), "Cancelled record disappeared");
            assert(!context.query("[data-delete-reading]").disabled, "Cancelled delete button stayed disabled");
            assert(!context.query(".notification-success"), "Cancellation showed success");
        }
    });
    await check("Confirmed deletion refreshes records, all cards, trends, alerts and another open page", async () => {
        const state = database([row(), row({ id: 2, heart_rate: 120, spo2: 94, systolic: 150, diastolic: 95, temperature: 39, measured_at: "2020-01-03T10:30" })]);
        const dashboard = await setup("dashboard", state, { confirm: true });
        const form = await setup("add-reading", state, { confirm: true });
        const records = await setup("health-records", state, { confirm: true });
        const trends = await setup("health-trends", state);
        const alerts = await setup("health-alerts", state);
        await waitFor(() => dashboard.query('[data-delete-reading="2"]') && form.query('[data-delete-reading="2"]'));
        await waitFor(() => records.query('[data-delete-reading="2"]'));
        records.query('[data-delete-reading="2"]').click();
        await waitFor(() => dashboard.query("#latestHeartRate").textContent === "72" && !form.query('[data-delete-reading="2"]'));
        assert(dashboard.query("#latestSpo2").textContent === "98", "Oxygen card did not refresh");
        assert(dashboard.query("#latestBloodPressure").textContent === "120/80", "Pressure card did not refresh");
        assert(dashboard.query("#latestTemperature").textContent === "36.5", "Temperature card did not refresh");
        assert(JSON.stringify(dashboard.charts.at(-1)[0].y) === "[72]", "Deleted point stayed in trends");
        await waitFor(() => alerts.query("#alertSummary").textContent === "No demo rules matched." && trends.charts.at(-1)?.[0].y.length === 1);
        assert(!alerts.query(".health-alert-card"), "Alerts did not re-evaluate");
        assert(records.query(".notification-success"), "Success message missing");
        const deletion = state.calls.find(call => call.method === "DELETE");
        assert(deletion.url === "/api/readings/2" && deletion.credentials === "same-origin", "DELETE did not target the signed-in record");
        form.query('[data-delete-reading="1"]').click();
        await waitFor(() => dashboard.query("#latestHeartRate").textContent === "--" && !form.query("#savedReadingsBody tr"));
        assert(!dashboard.query("#readingsTableBody tr") && !dashboard.query("#dashboardEmptyMessage").hidden, "Final deletion did not clear history");
        assert(dashboard.query("#healthTrendChart").textContent.includes("No health readings available"), "Final deletion did not clear trends");
        await waitFor(() => alerts.query("#alertSummary").textContent === "No health readings available." && !records.query("#readingsTableBody tr"));
        assert(trends.query("#healthTrendChart").textContent.includes("No health readings available"), "Dedicated trends did not clear");
        assert(!form.query("#emptyReadingsMessage").hidden && form.query(".notification-success"), "Form deletion feedback missing");
    });
    await check("Deleting a backdated latest save recalculates alerts from the remaining latest save", async () => {
        const state = database([row({ id: 1, heart_rate: 110 }), row({ id: 2, heart_rate: 130, measured_at: "2020-01-01T10:00" })]);
        const context = await setup("health-alerts", state);
        const records = await setup("health-records", state, { confirm: true });
        await waitFor(() => context.query("#alertsContainer").textContent.includes("130 BPM"));
        await waitFor(() => records.query('[data-delete-reading="2"]'));
        records.query('[data-delete-reading="2"]').click();
        await waitFor(() => context.query("#alertsContainer").textContent.includes("110 BPM"));
        assert(!context.query("#alertsContainer").textContent.includes("130 BPM"), "Deleted backdated record remained in alerts");
    });
    await check("Failed and missing-record deletions show errors and preserve visible data", async () => {
        for (const page of ["dashboard", "health-records", "add-reading"]) {
            const state = database([row({ heart_rate: 120 })]);
            state.failDelete = true;
            const context = await setup(page, state, { confirm: true });
            await waitFor(() => context.query("[data-delete-reading]"));
            context.query("[data-delete-reading]").click();
            await waitFor(() => context.query(".notification-error"));
            assert(state.rows.length === 1 && context.query(".health-table tbody tr"), "Failed DELETE removed a reading");
            assert(!context.query("[data-delete-reading]").disabled, "Failed DELETE cannot be retried");
