<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Sidebar navigation checks</title>
<pre id="results">RUNNING</pre>
<script>
"use strict";
(async () => {
    const results = [];
    const pause = (ms = 20) => new Promise(resolve => setTimeout(resolve, ms));
    function assert(condition, message) { if (!condition) throw new Error(message); }
    async function waitFor(condition) {
        for (let attempt = 0; attempt < 250; attempt++) {
            if (condition()) return;
            await pause();
        }
        throw new Error("Timed out waiting for sidebar selection");
    }
    async function setup(url = "/dashboard.html", width = 1366) {
        const frame = document.createElement("iframe");
        frame.style.cssText = `width:${width}px;height:768px;border:0;display:block`;
        const loaded = new Promise(resolve => { frame.onload = resolve; });
        frame.src = url;
        document.body.appendChild(frame);
        await loaded;
        // Check navigation independently of compositor animation timing.
        frame.contentDocument.documentElement.style.scrollBehavior = "auto";
        await pause(50);
        return { frame, query: selector => frame.contentDocument.querySelector(selector) };
    }
    function current(context) {
        const selected = context.frame.contentDocument.querySelectorAll(".sidebar-nav a.active");
        assert(selected.length === 1, "Expected exactly one active link");
        const announced = context.frame.contentDocument.querySelectorAll(".sidebar-nav [aria-current]");
        assert(announced.length === 1 && announced[0] === selected[0], "Accessible current item differs from visual selection");
        return selected[0].textContent.trim();
    }
    function checkFooter(context) {
        const footer = context.query(".sidebar-bottom");
        const links = [...footer.querySelectorAll("a")];
        assert(footer.querySelectorAll("p").length === 1 && footer.querySelector("p").textContent === "SmartHealth Patient Portal", "Footer branding differs");
        assert(links.length === 2, "Expected exactly two footer links without duplicates");
        for (const [index, [href, label]] of [["/index.html", "Back to Home"], ["/dashboard.html", "Back to Dashboard"]].entries()) {
            const link = links[index];
            assert(link.getAttribute("href") === href && link.textContent.trim() === label, "Wrong footer link or order");
            assert(link.querySelectorAll('svg[aria-hidden="true"]').length === 1, "Missing decorative footer icon");
            assert(link.getBoundingClientRect().height > 0, "Footer link is hidden");
        }
        const style = link => context.frame.contentWindow.getComputedStyle(link);
        for (const property of ["fontSize", "fontWeight", "color", "gap", "minHeight", "marginTop", "alignItems"]) {
            assert(style(links[0])[property] === style(links[1])[property], "Footer links have inconsistent " + property);
        }
    }
    async function check(label, test) {
        try { await test(); results.push("PASS " + label); }
        catch (error) { results.push("FAIL " + label + ": " + error.message); }
        document.querySelectorAll("iframe").forEach(frame => frame.remove());
    }
    for (const [path, label] of [["/dashboard.html", "Dashboard"], ["/add-reading.html", "Add Reading"], ["/health-records.html", "Health Records"], ["/health-trends.html", "Health Trends"], ["/health-alerts.html", "Health Alerts"], ["/consultation.html", "Doctor Consultation"], ["/profile.html", "My Profile"]]) {
        await check(label + " is selected on its page", async () => {
            const context = await setup(path);
            assert(current(context) === label, "Wrong page selected");
            assert(context.query(".sidebar-nav a.active").getAttribute("aria-current") === "page", "Page selection not announced");
            assert(context.frame.contentDocument.querySelectorAll(".sidebar-nav a .sidebar-icon").length === 7, "Missing navigation icons");
            assert(context.query(".sidebar-heading").textContent.includes("Patient Area"), "Missing portal card");
            checkFooter(context);
            assert(context.frame.contentWindow.getComputedStyle(context.query(".sidebar-toggle")).display === "none", "Desktop toggle should be hidden");
            assert(!context.query(".sidebar-content").hidden, "Desktop navigation should be expanded");
        });
        await check(label + " has an accessible collapsible mobile menu", async () => {
            const context = await setup(path, 390);
            const toggle = context.query(".sidebar-toggle");
            const content = context.query(".sidebar-content");
            assert(toggle.tagName === "BUTTON" && toggle.type === "button", "Toggle must be a native keyboard-accessible button");
            assert(toggle.getAttribute("aria-controls") === content.id, "Toggle does not identify its content");
            assert(content.hidden && toggle.getAttribute("aria-expanded") === "false", "Mobile menu should start closed");
            toggle.focus();
            toggle.click();
            assert(!content.hidden && toggle.getAttribute("aria-expanded") === "true", "Menu did not open");
            checkFooter(context);
            assert(current(context) === label, "Opening menu changed active page");
            const active = context.query(".sidebar-nav a.active");
            active.focus();
            assert(context.frame.contentDocument.activeElement === active, "Links cannot receive keyboard focus");
            active.dispatchEvent(new context.frame.contentWindow.KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
            assert(content.hidden && toggle.getAttribute("aria-expanded") === "false", "Escape did not close menu");
            assert(context.frame.contentDocument.activeElement === toggle, "Escape did not restore toggle focus");
            toggle.click();
            toggle.click();
            assert(content.hidden, "Toggle did not close menu");
            assert(context.frame.contentDocument.documentElement.scrollWidth <= 390, "Mobile page has horizontal overflow");
        });
        for (const width of [1366, 390]) {
            for (const [href, destination] of [["/index.html", "Home"], ["/dashboard.html", "Dashboard"]]) {
                await check(label + " footer opens " + destination + " at " + width + "px", async () => {
                    const context = await setup(path, width);
                    if (width <= 900) context.query(".sidebar-toggle").click();
                    context.query(`.sidebar-bottom a[href="${href}"]`).click();
                    await waitFor(() => context.frame.contentWindow.location.pathname === href
                        && (destination === "Home" ? context.query(".site-header") : context.query(".sidebar-nav a.active")));
                    if (destination === "Dashboard") {
                        assert(current(context) === "Dashboard", "Dashboard active marker lost");
                        if (width <= 900) {
                            assert(context.query(".sidebar-content").hidden, "Destination mobile menu should start closed");
                            context.query(".sidebar-toggle").click();
                        }
                        checkFooter(context);
                    }
                });
            }
        }
    }
    for (const [filename, label] of [["dashboard.html", "Dashboard"], ["add-reading.html", "Add Reading"], ["health-records.html", "Health Records"], ["health-trends.html", "Health Trends"], ["health-alerts.html", "Health Alerts"], ["consultation.html", "Doctor Consultation"], ["profile.html", "My Profile"]]) {
        await check("Clicking " + label + " opens its dedicated page", async () => {
            const context = await setup("/add-reading.html");
            context.query(`.sidebar-nav a[href="${filename}"]`).click();
            await waitFor(() => context.frame.contentWindow.location.pathname === "/" + filename && current(context) === label);
            assert(!context.frame.contentWindow.location.hash, "Navigation still uses an anchor");
        });
    }
    await check("Browser Back restores the previous page marker", async () => {
        const context = await setup();
        context.query('.sidebar-nav a[href="health-trends.html"]').click();
        await waitFor(() => current(context) === "Health Trends");
        context.query('.sidebar-nav a[href="health-records.html"]').click();
        await waitFor(() => current(context) === "Health Records");
        context.frame.contentWindow.history.back();
        await waitFor(() => current(context) === "Health Trends");
    });
    await check("Scrolling Dashboard keeps Dashboard selected", async () => {
        const context = await setup();
        context.query("#recent-readings").scrollIntoView({ block: "start", behavior: "instant" });
        context.frame.contentWindow.dispatchEvent(new context.frame.contentWindow.Event("scroll"));
        await pause(100);
        assert(current(context) === "Dashboard", "Overview scrolling changed the page marker");
    });
    await check("The active mobile link is visible when the menu opens", async () => {
        const context = await setup("/consultation.html", 390);
        assert(current(context) === "Doctor Consultation", "Wrong mobile selection");
        context.query(".sidebar-toggle").click();
        const menu = context.query(".sidebar-nav").getBoundingClientRect();
        const active = context.query(".sidebar-nav a.active").getBoundingClientRect();
        assert(active.left >= menu.left - 1 && active.right <= menu.right + 1, "Active link is outside menu");
        assert(active.top >= 0 && active.bottom <= 768, "Active link is outside viewport");
        assert(context.frame.contentWindow.scrollY === 0, "Opening menu scrolled the page");
    });
    await check("A mobile feature link navigates and leaves the destination menu closed", async () => {
        const context = await setup("/dashboard.html", 390);
        context.query(".sidebar-toggle").click();
        context.query('.sidebar-nav a[href="health-alerts.html"]').click();
        assert(context.query(".sidebar-content").hidden, "Navigation did not collapse menu");
        await waitFor(() => context.frame.contentWindow.location.pathname === "/health-alerts.html" && current(context) === "Health Alerts");
        assert(context.query(".sidebar-content").hidden, "Destination menu should start closed");
        assert(current(context) === "Health Alerts", "Wrong mobile section selected");
    });
    await check("Clicking outside the mobile menu closes it", async () => {
        const context = await setup("/dashboard.html", 390);
        context.query(".sidebar-toggle").click();
        context.query(".dashboard-main h1").click();
        assert(context.query(".sidebar-content").hidden, "Outside click did not close menu");
    });
    await check("The menu resets correctly across tablet and desktop breakpoints", async () => {
        const context = await setup("/profile.html", 820);
        const toggle = context.query(".sidebar-toggle");
        const content = context.query(".sidebar-content");
        assert(content.hidden, "Tablet should use collapsed menu");
        toggle.click();
        context.query(".sidebar-nav a.active").focus();
        context.frame.style.width = "1200px";
        await waitFor(() => context.frame.contentWindow.getComputedStyle(toggle).display === "none" && !content.hidden).catch(() => {
            throw new Error("Desktop resize: width=" + context.frame.contentWindow.innerWidth + ", hidden=" + content.hidden + ", toggle=" + context.frame.contentWindow.getComputedStyle(toggle).display);
        });
        assert(context.frame.contentWindow.innerWidth === 1200, "Desktop frame has not resized");
        context.frame.style.width = "390px";
        await waitFor(() => context.frame.contentWindow.getComputedStyle(toggle).display !== "none" && content.hidden).catch(() => {
            throw new Error("Mobile resize: width=" + context.frame.contentWindow.innerWidth + ", hidden=" + content.hidden + ", toggle=" + context.frame.contentWindow.getComputedStyle(toggle).display);
        });
        assert(context.frame.contentDocument.activeElement === toggle, "Resize left focus inside hidden menu");
        toggle.click();
        assert(!content.hidden, "Toggle failed after resize");
    });
    await check("Every navigation destination resolves", async () => {
        const context = await setup();
        for (const link of context.frame.contentDocument.querySelectorAll(".sidebar-nav a, .sidebar-bottom a, .dashboard-logo")) {
            const url = new URL(link.href);
            const response = await fetch(url.pathname);
            assert(response.ok, "Broken destination " + link.href);
            assert(!url.hash, "Sidebar still links to a dashboard section");
            if (url.hash) {
                const page = new DOMParser().parseFromString(await response.text(), "text/html");
                assert(page.getElementById(url.hash.slice(1)), "Missing destination section " + url.hash);
            }
        }
    });
    await check("Profile keeps its lavender theme while sidebar uses shared teal", async () => {
        const context = await setup("/profile.html");
        const styles = node => context.frame.contentWindow.getComputedStyle(node);
        assert(styles(context.query(".dashboard-main")).getPropertyValue("--primary").trim() === "#7043ad", "Profile theme changed");
        assert(styles(context.query(".sidebar-nav a.active")).color === "rgb(7, 103, 116)", "Profile sidebar is not teal");
        assert(styles(context.query(".sidebar-nav a.active")).backgroundColor === "rgb(232, 244, 250)", "Profile active background is not blue");
    });
    await check("Unknown dashboard fragments fall back to the page marker", async () => {
        const context = await setup("/dashboard.html#unknown-section");
        assert(current(context) === "Dashboard", "Unknown section broke page selection");
    });
    document.querySelector("#results").textContent = results.join("\n") + "\nDONE";
})().catch(error => { document.querySelector("#results").textContent = "FAIL " + error.stack; });
</script>
</html>
